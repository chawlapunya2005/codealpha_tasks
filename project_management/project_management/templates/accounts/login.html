{% extends 'base.html' %}
{% block title %}Login — TaskFlow{% endblock %}
{% block extra_css %}
<style>
.auth-container{max-width:420px;margin:4rem auto;padding:0 1.5rem;}
.auth-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2.5rem;}
.auth-box h1{font-size:1.6rem;font-weight:700;margin-bottom:0.3rem;}
.auth-box p{color:var(--muted);font-size:0.875rem;margin-bottom:2rem;}
.field{margin-bottom:1rem;}
.field label{display:block;font-size:0.8rem;color:var(--muted);font-weight:500;margin-bottom:0.35rem;}
.field input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:0.65rem 1rem;border-radius:8px;font-family:'Inter',sans-serif;font-size:0.9rem;}
.field input:focus{outline:none;border-color:var(--accent);}
.auth-link{text-align:center;margin-top:1.2rem;font-size:0.875rem;color:var(--muted);}
.auth-link a{color:var(--accent);}
</style>
{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <h1>Welcome Back</h1>
        <p>Login to your TaskFlow account</p>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="field"><label>{{ field.label }}</label>{{ field }}</div>
            {% endfor %}
            <button type="submit" class="btn btn-primary" style="width:100%;padding:0.8rem;font-size:1rem;justify-content:center;margin-top:0.5rem;">Login</button>
        </form>
        <div class="auth-link">New here? <a href="/accounts/register/">Create an account</a></div>
    </div>
</div>
{% endblock %}
