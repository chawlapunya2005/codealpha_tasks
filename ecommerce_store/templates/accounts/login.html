{% extends 'base.html' %}
{% block title %}Login — ShopAlpha{% endblock %}
{% block extra_css %}
<style>
.auth-container { max-width:420px; margin:4rem auto; padding:0 1.5rem; }
.auth-box { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:2.5rem; }
.auth-box h1 { font-family:'Playfair Display',serif; font-size:2rem; margin-bottom:0.5rem; }
.auth-box p { color:var(--muted); margin-bottom:2rem; font-size:0.9rem; }
.field { margin-bottom:1.2rem; }
.field label { display:block; font-size:0.85rem; color:var(--muted); margin-bottom:0.4rem; }
.field input { width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:0.7rem 1rem; border-radius:8px; font-family:'DM Sans',sans-serif; font-size:0.95rem; }
.field input:focus { outline:none; border-color:var(--accent); }
.auth-link { text-align:center; margin-top:1.5rem; font-size:0.9rem; color:var(--muted); }
.auth-link a { color:var(--accent); }
</style>
{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <h1>Welcome Back</h1>
        <p>Login to your ShopAlpha account</p>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="field">
                <label>{{ field.label }}</label>
                {{ field }}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary" style="width:100%;padding:0.8rem;font-size:1rem;margin-top:0.5rem;">Login</button>
        </form>
        <div class="auth-link">New here? <a href="/accounts/register/">Create an account</a></div>
    </div>
</div>
{% endblock %}
